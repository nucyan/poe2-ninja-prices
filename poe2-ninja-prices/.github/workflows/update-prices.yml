name: update-prices

on:
  schedule:
    # 2時間ごと（poe.ninja の PoE2 価格は約1時間ごとに更新される）
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node update-prices.mjs --out poe2
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poe2
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
